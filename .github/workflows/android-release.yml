name: Publish a release
run-name: Publish release ${{ inputs.tag }}

# Publishes a GitHub release of this fork (the latest successful app build's APK), or, when the
# tag already has a release, updates its title and notes from docs/releases/<tag>.md. It never builds anything, and runs only when started by hand.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v0.1.1
        type: string
        default: v0.1.1
      title:
        description: Release title
        type: string
        default: Horizon Android 0.1.1

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
      TITLE: ${{ inputs.title }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - name: Publish or update the release
        run: |
          notes="docs/releases/$TAG.md"
          if gh release view "$TAG" >/dev/null 2>&1; then
            # The release exists: only its title and notes change.
            gh release edit "$TAG" --title "$TITLE" --notes-file "$notes"
          else
            app=$(gh run list --workflow android-dev.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')
            mkdir -p dl/app out
            gh run download "$app" --dir dl/app
            find dl -name '*.apk' -exec cp {} out/ \;
            ls -l out
            gh release create "$TAG" out/* --title "$TITLE" --notes-file "$notes" --target "$GITHUB_SHA"
          fi
