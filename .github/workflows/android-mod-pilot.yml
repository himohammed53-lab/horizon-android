name: Build a .hmod mod
run-name: Build .hmod · ${{ inputs.mod_dirs }}

# Builds one WebAssembly mod into a .hmod file you can import in the game's
# Mods page. It never builds the app, and it does not run on push.
on:
  workflow_dispatch:
    inputs:
      mod_dirs:
        description: Folders of the mod crates (each has horizon-mod.toml), separated by spaces
        type: string
        default: crates/horizon-mod-sdk/examples/waypoints

permissions:
  contents: read

jobs:
  hmod:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      HORIZON_TELEMETRY_URL: 'off'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - name: Install the WebAssembly target
        run: |
          rustup show
          rustup target add wasm32-unknown-unknown
      - name: Build the mod tool
        run: cargo build --release -p cargo-horizon-mod
      - name: Build the .hmod files
        env:
          MOD_DIRS: ${{ inputs.mod_dirs }}
        run: |
          for dir in $MOD_DIRS; do
            (cd "$dir" && "$GITHUB_WORKSPACE/target/release/cargo-horizon-mod" build)
          done
      - name: Collect and check the package
        run: |
          mkdir -p out
          cp "$GITHUB_WORKSPACE"/target/horizon-mod/*.hmod out/
          for f in out/*.hmod; do
            "$GITHUB_WORKSPACE/target/release/cargo-horizon-mod" check "$f"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hmod
          path: out/*.hmod
          if-no-files-found: error
