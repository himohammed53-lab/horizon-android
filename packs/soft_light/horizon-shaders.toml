schema = 1
id = "soft_light"
name = "Soft Light"
version = "0.1.0"
api = "0.1"
description = "A light shader for phones: real sun light and block shadows, soft shade under cover, warm sunsets and torches, a clear sky, water with waves, a purple End with a galaxy and a warm Nether. No shadow map and no extra full-screen pass."
authors = ["Muhamed", "Claude"]
license = "MIT"
shared = ["common.wgsl"]

[sky]
file = "sky.wgsl"
name = "Clear sky"

[material]
file = "material.wgsl"

[shadow]
resolution = 1024
distance = 64.0

[[post]]
file = "post/end.wgsl"
name = "End sky"

[[options]]
id = "nether_end"
name = "Nether and End look"
description = "Purple End with a swirling galaxy, warm glowing Nether. Off keeps vanilla's."
type = "bool"
default = true

[[options]]
id = "sky_style"
name = "Sky style"
description = "How much of the clear gradient sky replaces vanilla's sky (0 is vanilla's)."
type = "float"
default = 0.6
min = 0.0
max = 1.0
step = 0.05

[[options]]
id = "tone"
name = "Colour grade"
description = "How much the soft tone mapping and colour boost are applied (0 is vanilla's)."
type = "float"
default = 0.7
min = 0.0
max = 1.0
step = 0.05

[[options]]
id = "saturation"
name = "Saturation"
description = "How colourful the picture is."
type = "float"
default = 1.1
min = 0.8
max = 1.5
step = 0.05

[[options]]
id = "contrast"
name = "Contrast"
description = "Lower is brighter and flatter, 1 leaves the brightness as it is."
type = "float"
default = 0.85
min = 0.6
max = 1.0
step = 0.05

[[options]]
id = "sun_strength"
name = "Sunlight"
description = "How strong the sun's light and the block shadows are (0 is flat light)."
type = "float"
default = 1.0
min = 0.0
max = 1.5
step = 0.05

[[options]]
id = "end_stars"
name = "End stars"
description = "How bright the stars of the End's sky are (0 hides them)."
type = "float"
default = 1.0
min = 0.0
max = 2.0
step = 0.1

[[options]]
id = "shade"
name = "Soft shade"
description = "How dark places under trees, roofs and overhangs get in daylight."
type = "float"
default = 0.5
min = 0.0
max = 1.0
step = 0.05

[[options]]
id = "warmth"
name = "Warm sunlight"
description = "How golden the light turns at sunrise and sunset."
type = "float"
default = 0.35
min = 0.0
max = 1.0
step = 0.05

[[options]]
id = "torch"
name = "Torch light"
description = "How warm and strong torch light is, with a gentle flicker."
type = "float"
default = 0.6
min = 0.0
max = 1.0
step = 0.05

[[options]]
id = "waves"
name = "Water waves"
description = "How strong the waves and the shine of the water are."
type = "float"
default = 1.0
min = 0.0
max = 2.0
step = 0.1

[[options]]
id = "water_opacity"
name = "Water opacity"
description = "How see-through the water is (lower is clearer)."
type = "float"
default = 0.6
min = 0.3
max = 1.0
step = 0.05

[budget]
gpu_ms = 2.5
