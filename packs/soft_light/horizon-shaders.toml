schema = 1
id = "soft_light"
name = "Soft Light"
version = "0.2.0"
api = "0.1"
description = "A light shader for phones: bright sun light on every face, soft shade under cover, warm sunsets and torches, a clear sky, water with waves, moving grass, leaves and water, a purple End with a galaxy and a warm Nether. Shadows come from one 1024 shadow map; there is no full-screen pass."
authors = ["Muhamed", "Claude"]
license = "MIT"
shared = ["common.wgsl"]

[sky]
file = "sky.wgsl"
name = "Clear sky"
end = true

[material]
file = "material.wgsl"

[shadow]
resolution = 1024
distance = 48.0
solid_materials = [23]

[[materials]]
id = 20
sprites = ["block/short_grass", "block/fern", "block/dandelion", "block/poppy", "block/azure_bluet", "block/allium", "block/blue_orchid", "block/cornflower", "block/oxeye_daisy", "block/lily_of_the_valley", "block/*_tulip", "block/vine"]

[[materials]]
id = 21
sprites = ["block/tall_grass_bottom", "block/large_fern_bottom", "block/sunflower_bottom", "block/rose_bush_bottom", "block/peony_bottom", "block/lilac_bottom"]

[[materials]]
id = 22
sprites = ["block/tall_grass_top", "block/large_fern_top", "block/sunflower_top", "block/rose_bush_top", "block/peony_top", "block/lilac_top"]

[[materials]]
id = 23
sprites = ["block/*_leaves"]

[[materials]]
id = 24
sprites = ["block/water_still", "block/water_flow"]

[[options]]
id = "nether_end"
name = "Nether and End look"
description = "Purple End with a swirling galaxy, warm glowing Nether. Off keeps vanilla's."
type = "bool"
default = true

[[options]]
id = "sky_style"
name = "Sky style"
description = "How much of the clear gradient sky replaces vanilla's sky (0 is vanilla's)."
type = "float"
default = 0.6
min = 0.0
max = 1.0
step = 0.05

[[options]]
id = "tone"
name = "Colour grade"
description = "How much the soft tone mapping and colour boost are applied (0 is vanilla's)."
type = "float"
default = 0.6
min = 0.0
max = 1.0
step = 0.05

[[options]]
id = "saturation"
name = "Saturation"
description = "How colourful the picture is."
type = "float"
default = 1.12
min = 0.8
max = 1.5
step = 0.05

[[options]]
id = "contrast"
name = "Contrast"
description = "Lower is brighter and flatter, 1 leaves the brightness as it is."
type = "float"
default = 0.93
min = 0.6
max = 1.0
step = 0.05

[[options]]
id = "sun_strength"
name = "Sunlight"
description = "How strong and bright the sun's light is (0 is flat light)."
type = "float"
default = 1.0
min = 0.0
max = 1.5
step = 0.05

[[options]]
id = "end_stars"
name = "End stars"
description = "How bright the stars of the End's sky are (0 hides them)."
type = "float"
default = 1.0
min = 0.0
max = 2.0
step = 0.1

[[options]]
id = "sway_plants"
name = "Moving grass"
description = "How much grass and flowers bend in the wind (0 keeps them still)."
type = "float"
default = 1.0
min = 0.0
max = 2.0
step = 0.1

[[options]]
id = "sway_leaves"
name = "Moving leaves"
description = "How much leaves rustle (0 keeps them still)."
type = "float"
default = 1.0
min = 0.0
max = 2.0
step = 0.1

[[options]]
id = "water_motion"
name = "Moving water"
description = "How much the water surface rises and falls (0 keeps it flat)."
type = "float"
default = 1.0
min = 0.0
max = 2.0
step = 0.1

[[options]]
id = "shade"
name = "Soft shade"
description = "How dark places under trees, roofs and overhangs get in daylight."
type = "float"
default = 0.5
min = 0.0
max = 1.0
step = 0.05

[[options]]
id = "warmth"
name = "Warm sunlight"
description = "How golden the light turns at sunrise and sunset."
type = "float"
default = 0.35
min = 0.0
max = 1.0
step = 0.05

[[options]]
id = "torch"
name = "Torch light"
description = "How warm and strong torch light is, with a gentle flicker."
type = "float"
default = 0.6
min = 0.0
max = 1.0
step = 0.05

[[options]]
id = "waves"
name = "Water waves"
description = "How strong the waves and the shine of the water are."
type = "float"
default = 1.0
min = 0.0
max = 2.0
step = 0.1

[[options]]
id = "water_opacity"
name = "Water opacity"
description = "How see-through the water is (lower is clearer)."
type = "float"
default = 0.6
min = 0.3
max = 1.0
step = 0.05

[budget]
gpu_ms = 2.0
