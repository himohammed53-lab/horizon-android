id = "waypoints_file"
name = "Waypoints"
version = "0.2.0"
description = "Waypoints on the screen: a coloured rounded square with the name's first letter, the name and the distance; bigger as you come near, shown only while you look towards them. Needs Horizon API level 10. A skull marks where you last died. Manage them in Options > Mods > Waypoints, or with /wp (try /wp help)."
authors = ["Horizon Android fork"]
api = "0.1"
side = "client"
capabilities = ["game-read", "render", "ui", "storage", "chat"]
experimental = ["render", "ui"]
