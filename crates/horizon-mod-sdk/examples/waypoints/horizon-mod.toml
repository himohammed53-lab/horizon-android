id = "waypoints_file"
name = "Waypoints"
version = "0.1.0"
description = "Waypoints you see on the screen from far away: they grow as you come near, with a name, a colour and the distance. A skull marks where you last died. Manage them in Options > Mods > Waypoints, or with /wp (try /wp help)."
authors = ["Horizon Android fork"]
api = "0.1"
side = "client"
capabilities = ["game-read", "render", "ui", "storage", "chat"]
experimental = ["render", "ui"]
